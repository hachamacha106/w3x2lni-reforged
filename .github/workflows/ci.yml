name: CI quick checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python and release safeguards
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Check repository identity
        run: python -B tools/check_repository.py
      - name: Validate release metadata
        run: python -B test/release/release_artifact.py metadata
      - name: Compile-check Python sources
        run: python -B -m compileall -q make test/compat test/release tools
      - name: Test packaging invariants
        run: python -B test/compat/test_package_release.py
      - name: Test declared native origins and tamper rejection
        run: python -B test/compat/test_runtime_origins.py
      - name: Test pinned native build recipes
        run: python -B test/release/test_native_runtime.py
      - name: Test native release acceptance gates
        run: python -B test/release/test_windows_report.py
